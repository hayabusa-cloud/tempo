name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  GOSUMDB: 'off'

jobs:
  verify:
    name: Go, TLA+, and Lean
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false

      - name: Check Go
        run: ./verify.sh go

      - name: Check TLA+ models
        run: ./verify.sh tla

      - name: Install Lean
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          series=$(cat proofs/lean-version)
          toolchain=$(gh api --paginate 'repos/leanprover/lean4/releases?per_page=100' \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
            awk -v prefix="v${series%.x}." '
              index($0, prefix) == 1 && substr($0, length(prefix) + 1) ~ /^[0-9]+$/ { print }
            ' | sort -V | tail -n 1)
          if [ -z "$toolchain" ]; then
            printf 'No stable Lean %s release found.\n' "$series" >&2
            exit 1
          fi
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y \
            --default-toolchain none --no-modify-path
          "$HOME/.elan/bin/elan" toolchain install "leanprover/lean4:$toolchain"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check Lean proofs and certificates
        run: ./verify.sh certificates

      - name: Collect runtime coverage
        run: go test -buildvcs=false -tags=tempo_verify -timeout 120s -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Save runtime coverage
        uses: actions/upload-artifact@v7
        with:
          name: tempo-runtime-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

      - name: Upload runtime coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage.out
          disable_search: true
          fail_ci_if_error: true
