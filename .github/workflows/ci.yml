name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  GOSUMDB: 'off'

jobs:
  verify:
    name: Go and TLA+
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false

      - name: Check Go
        run: ./verify.sh go

      - name: Check TLA+ models
        run: ./verify.sh tla

      - name: Collect runtime coverage
        run: go test -buildvcs=false -tags=tempo_verify -timeout 120s -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Save runtime coverage
        uses: actions/upload-artifact@v7
        with:
          name: tempo-runtime-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

      - name: Upload runtime coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage.out
          disable_search: true
          fail_ci_if_error: true
